<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#fbfaf6">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Para ti</title>

<meta property="og:title" content="Tengo algo que decirte">
<meta property="og:description" content="Ábrelo cuando estés tranquila.">
<meta property="og:type" content="website">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&family=Dancing+Script:wght@500;600&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">

<style>
/* ============================================================
   PALETA · noche bosque + papel amate, temática Pocahontas
   ============================================================ */
:root{
  --noche:#fbfaf6;
  --tinta-clara:#2b2318;
  --tinta-clara-suave:rgba(43,35,24,.65);
  --rosa-luz:#ff6a3d;
  --rosa-luz-suave:rgba(255,106,61,.35);

  --papel:#f7f0e2;
  --papel-borde:#c9a877;
  --texto:#2b2318;
  --texto-suave:#6b5c42;
  --acento:#c4451c;
  --acento-claro:#e0722f;
  --renglon:rgba(196,69,28,.14);

  --sobre:#3a2a22;
  --sobre-osc:#1f1712;

  --serif:'Cormorant Garamond', Georgia, 'Times New Roman', serif;
  --mano:'Dancing Script', 'Segoe Script', cursive;
  --sans:'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  --safe-t:env(safe-area-inset-top, 0px);
  --safe-b:env(safe-area-inset-bottom, 0px);
}

*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}

/* El scroll lo lleva el <html>, nunca el <body>: si el body fuera el que
   scrollea, window.scrollY se quedaría en 0 y se romperían el parallax
   y el indicador de "desliza". */
html{
  height:100%;
  overflow-x:hidden;
  overflow-x:clip;        /* "clip" no crea barra lateral; el de arriba es el respaldo */
  overflow-y:hidden;
  overscroll-behavior-x:none;
}
html.leyendo{
  overflow-y:auto;
  -webkit-overflow-scrolling:touch;
}

html,body{
  background:var(--noche);
  color:var(--tinta-clara);
  font-family:var(--sans);
  -webkit-font-smoothing:antialiased;
  -webkit-text-size-adjust:100%;
  -webkit-tap-highlight-color:transparent;
  overscroll-behavior:none;
}

body{
  min-height:100%;
  overflow-x:hidden;
  overflow-x:clip;
  /* el dedo solo mueve la carta hacia arriba y abajo, nunca de lado */
  touch-action:pan-y;
  overscroll-behavior-x:none;
}

button{font:inherit;color:inherit;background:none;border:none;cursor:pointer;}

#cielo{position:fixed;inset:0;z-index:0;display:block;}

.halo{
  position:fixed;left:50%;top:42%;
  width:min(140vw,900px);height:min(140vw,900px);
  transform:translate(-50%,-50%);
  background:radial-gradient(circle, rgba(255,106,61,.14) 0%, rgba(196,69,28,.05) 38%, transparent 68%);
  z-index:1;pointer-events:none;
  animation:respirar 9s ease-in-out infinite;
}
@keyframes respirar{
  0%,100%{opacity:.75;transform:translate(-50%,-50%) scale(1);}
  50%{opacity:1;transform:translate(-50%,-50%) scale(1.09);}
}

.velo{
  position:fixed;inset:0;z-index:2;
  background:rgba(20,10,6,.6);
  opacity:0;pointer-events:none;
  transition:opacity 1.2s ease;
}
.velo.ver{opacity:1;}

@keyframes aparecer{to{opacity:1;}}

/* ============================================================
   FIGURITAS QUE FLOTAN
   ============================================================ */
.decor{
  position:fixed;inset:0;z-index:3;
  pointer-events:none;overflow:hidden;
}
.decor .fig{
  position:absolute;
  opacity:0;
  will-change:transform;
  transition:opacity 1.4s ease;
}
.decor.ver .fig{opacity:.92;}

.fig .baila{
  display:block;
  animation:flotar var(--dur,6s) ease-in-out infinite;
  animation-delay:var(--del,0s);
}
.fig svg{
  display:block;width:100%;height:auto;
  filter:drop-shadow(0 5px 12px rgba(0,0,0,.4));
}

@keyframes flotar{
  0%,100%{transform:translateY(0) rotate(var(--rot,0deg)) scale(1);}
  33%{transform:translateY(-13px) rotate(calc(var(--rot,0deg) + 7deg)) scale(1.03);}
  66%{transform:translateY(5px) rotate(calc(var(--rot,0deg) - 5deg)) scale(.98);}
}

/* figuritas pegadas al borde de la hoja */
.borde{
  position:absolute;
  z-index:6;
  pointer-events:none;
}
.borde .baila{animation:flotar var(--dur,7s) ease-in-out infinite;animation-delay:var(--del,0s);display:block;}
.borde svg{display:block;width:100%;height:auto;filter:drop-shadow(0 4px 9px rgba(15,45,42,.28));}

/* figuritas dentro del texto */
.deco-linea{
  display:block;width:34px;margin:0 auto 10px;
  animation:mecer 4.5s ease-in-out infinite;
}
@keyframes mecer{
  0%,100%{transform:rotate(-7deg);}
  50%{transform:rotate(7deg);}
}

/* ============================================================
   PORTADA · EL SOBRE
   ============================================================ */
#escena{
  position:fixed;inset:0;z-index:8;
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  gap:clamp(26px,6.5vh,52px);
  padding:calc(var(--safe-t) + 24px) 22px calc(var(--safe-b) + 24px);
  transition:opacity .85s ease, transform 1s cubic-bezier(.4,0,.2,1);
}
#escena.fuera{opacity:0;transform:scale(1.28);pointer-events:none;}

.intro{text-align:center;opacity:0;animation:aparecer 1.6s ease .3s forwards;}
.intro .para{
  font-size:.66rem;letter-spacing:.36em;text-transform:uppercase;
  color:var(--rosa-luz);margin-bottom:14px;
}
.intro .nombre{
  font-family:var(--serif);
  font-size:clamp(2.3rem,10.5vw,3.2rem);
  font-weight:300;line-height:1.05;
}

.sobre-zona{position:relative;perspective:1400px;opacity:0;animation:aparecer 1.6s ease .9s forwards;}

.sobre{
  position:relative;
  width:min(80vw,330px);
  height:calc(min(80vw,330px) * .66);
  transform-style:preserve-3d;
  transition:transform .9s cubic-bezier(.4,0,.2,1);
  filter:drop-shadow(0 26px 45px rgba(0,0,0,.55));
}
.sobre:active{transform:scale(.975);}
.sobre.abierto,.sobre.abierto:active{transform:translateY(5%);}

.sobre-fondo{
  position:absolute;inset:0;
  background:linear-gradient(160deg,var(--sobre) 0%, var(--sobre-osc) 100%);
  border-radius:5px;z-index:1;
  box-shadow:inset 0 0 0 1px rgba(255,106,61,.28), inset 0 0 22px rgba(255,106,61,.1);
}

.hoja-mini{
  position:absolute;left:6%;bottom:5%;
  width:88%;height:86%;
  background:linear-gradient(175deg,#f7f1de 0%, #e8dcb4 100%);
  border-radius:3px;z-index:2;
  transform:translateY(0);
  transition:transform 1.05s cubic-bezier(.34,1.15,.64,1) .5s;
  box-shadow:0 2px 10px rgba(0,0,0,.18);
  overflow:hidden;
}
.hoja-mini::before{
  content:'';position:absolute;inset:14% 13%;
  background:repeating-linear-gradient(to bottom,
    rgba(196,69,28,.22) 0 1px, transparent 1px 10px);
  opacity:.55;
}
.sobre.abierto .hoja-mini{transform:translateY(-64%) scale(1.02);}

.sobre-frente{
  position:absolute;inset:0;
  background:linear-gradient(155deg,#2e2018 0%, #170f0a 100%);
  clip-path:polygon(0 0, 50% 46%, 100% 0, 100% 100%, 0 100%);
  border-radius:5px;z-index:3;
  box-shadow:inset 1px 0 0 rgba(255,106,61,.22);
}
.sobre-frente::after{
  content:'';position:absolute;inset:0;
  background:linear-gradient(105deg, rgba(255,106,61,.16) 0%, transparent 45%);
  opacity:.8;
}

.solapa{
  position:absolute;top:0;left:0;
  width:100%;height:46%;
  background:linear-gradient(180deg,#332419 0%, #170f0a 100%);
  clip-path:polygon(0 0, 100% 0, 50% 100%);
  transform-origin:top center;
  transform:rotateX(0deg);
  transition:transform .85s cubic-bezier(.6,0,.3,1), z-index 0s .42s;
  z-index:5;border-radius:5px 5px 0 0;
  backface-visibility:hidden;
  box-shadow:inset 0 1px 0 rgba(255,106,61,.25);
}
.sobre.abierto .solapa{transform:rotateX(-178deg);z-index:0;}

/* al guardar la carta, la solapa y la hoja se mueven sin esperar */
.sobre.cerrando .hoja-mini,
.sobre.cerrando .solapa{transition-delay:0s;}

.sello{
  position:absolute;left:50%;top:46%;
  width:31%;aspect-ratio:1;
  transform:translate(-50%,-50%);
  z-index:6;
  /* la sombra sigue la silueta de la flor, no un cuadro ni un círculo */
  filter:drop-shadow(0 5px 11px rgba(0,0,0,.45));
  transition:opacity .35s ease .1s, transform .5s ease;
}
.sello svg{display:block;width:100%;height:100%;}
.sobre.abierto .sello{opacity:0;transform:translate(-50%,-50%) scale(.4) rotate(30deg);}

/* figuritas que acompañan al sobre en la portada */
.guardia{
  position:absolute;
  width:clamp(46px,13vw,62px);
  z-index:7;
}
.guardia .baila{animation:flotar var(--dur,5.5s) ease-in-out infinite;animation-delay:var(--del,0s);display:block;}
.guardia svg{display:block;width:100%;height:auto;filter:drop-shadow(0 6px 14px rgba(0,0,0,.45));}
.guardia.izq{left:-14%;bottom:-12%;}
.guardia.der{right:-14%;top:-18%;}

.pista{text-align:center;opacity:0;animation:aparecer 1.4s ease 2s forwards;}
.pista .toca{
  font-size:.82rem;letter-spacing:.3em;text-transform:uppercase;
  color:var(--acento);
  text-shadow:0 0 18px rgba(255,106,61,.35);
  display:inline-flex;align-items:center;gap:12px;
  animation:latir 3.4s ease-in-out infinite;
}
.pista .toca::before,.pista .toca::after{
  content:'';width:24px;height:1px;background:var(--rosa-luz-suave);
}
@keyframes latir{0%,100%{opacity:.78;}50%{opacity:1;}}

.pista .volumen{
  margin-top:14px;
  font-size:.58rem;letter-spacing:.22em;text-transform:uppercase;
  color:var(--tinta-clara-suave);
}
.pulso{
  margin:14px auto 0;width:7px;height:7px;border-radius:50%;
  background:var(--rosa-luz);
  animation:pulso 2.4s ease-out infinite;
}
@keyframes pulso{
  0%{box-shadow:0 0 0 0 rgba(255,106,61,.45);}
  70%{box-shadow:0 0 0 22px rgba(255,106,61,0);}
  100%{box-shadow:0 0 0 0 rgba(255,106,61,0);}
}
#escena.abriendo .pista{opacity:0;transition:opacity .35s ease;animation:none;}
#escena.abriendo .intro{opacity:0;transition:opacity .9s ease .3s;animation:none;}

/* ============================================================
   LA HOJA
   ============================================================ */
#hoja{
  position:relative;z-index:5;
  display:none;
  width:min(88vw,40rem);
  margin:calc(var(--safe-t) + 30px) auto calc(var(--safe-b) + 48px);
  padding:clamp(34px,8vw,64px) clamp(24px,7vw,58px) clamp(52px,11vw,80px);

  /* papel quemado: chamusquina por todo el borde + un tostado general que
     sube desde las orillas. El borde comido lo pone #hoja::after con un
     filtro de ruido — a propósito NO se recorta la hoja con clip-path,
     porque los cortes rectos se veían como tijeretazos, no como quemado. */
  background:
    radial-gradient(60% 34px at 12% 0%,   rgba(48,22,6,.6),  transparent 70%),
    radial-gradient(48% 26px at 44% 0%,   rgba(48,22,6,.45), transparent 70%),
    radial-gradient(58% 40px at 82% 0%,   rgba(48,22,6,.55), transparent 70%),
    radial-gradient(56% 36px at 20% 100%, rgba(48,22,6,.58), transparent 70%),
    radial-gradient(50% 28px at 62% 100%, rgba(48,22,6,.45), transparent 70%),
    radial-gradient(40px 22% at 0% 22%,   rgba(48,22,6,.5),  transparent 72%),
    radial-gradient(34px 16% at 0% 68%,   rgba(48,22,6,.42), transparent 72%),
    radial-gradient(44px 20% at 100% 38%, rgba(48,22,6,.52), transparent 72%),
    radial-gradient(30px 14% at 100% 82%, rgba(48,22,6,.4),  transparent 72%),
    radial-gradient(125% 100% at 50% 50%, transparent 52%, rgba(62,30,10,.5) 100%),
    linear-gradient(to bottom, transparent 32.8%, rgba(196,69,28,.07) 33%, transparent 33.2%),
    linear-gradient(to bottom, transparent 66.3%, rgba(196,69,28,.055) 66.5%, transparent 66.7%),
    linear-gradient(168deg, #f7f2e2 0%, var(--papel) 42%, #e9d9b4 100%);

  color:var(--texto);
  box-shadow:0 26px 46px rgba(0,0,0,.45), 0 4px 10px rgba(40,18,4,.35);

  opacity:0;
  transform:translateY(46px) scale(.78);
  transform-origin:center top;
  transition:opacity 1s ease, transform 1.25s cubic-bezier(.18,.78,.25,1);
}
#hoja.abierta{display:block;}
#hoja.ver{opacity:1;transform:none;}

/* al cerrar, la hoja se encoge hacia abajo, como si volviera al sobre */
#hoja.guardando{
  opacity:0;
  transform:translateY(70px) scale(.7);
  transition:opacity .75s ease, transform .95s cubic-bezier(.5,0,.75,0);
}

/* El borde carbonizado. Lo que hace que se lea como QUEMADO y no como un
   marco oscuro es la rampa de color del papel hacia afuera:
   crema → tostado → marrón → casi negro en el filo, igual que el papel
   quemado de verdad. El filtro de ruido le ondula el contorno para que no
   se vea recto, y al ser pseudo-elemento nunca toca el texto. */
#hoja::after{
  content:'';
  position:absolute;inset:-11px;
  pointer-events:none;z-index:4;
  background:
    linear-gradient(to bottom, rgba(22,10,2,.97) 0px, rgba(66,30,7,.93) 8px,
      rgba(146,88,34,.72) 15px, rgba(212,172,108,.4) 21px, rgba(226,196,140,0) 30px),
    linear-gradient(to top,    rgba(22,10,2,.97) 0px, rgba(66,30,7,.93) 8px,
      rgba(146,88,34,.72) 15px, rgba(212,172,108,.4) 21px, rgba(226,196,140,0) 30px),
    linear-gradient(to right,  rgba(22,10,2,.97) 0px, rgba(66,30,7,.93) 8px,
      rgba(146,88,34,.72) 15px, rgba(212,172,108,.4) 21px, rgba(226,196,140,0) 30px),
    linear-gradient(to left,   rgba(22,10,2,.97) 0px, rgba(66,30,7,.93) 8px,
      rgba(146,88,34,.72) 15px, rgba(212,172,108,.4) 21px, rgba(226,196,140,0) 30px);
  filter:url(#quemadura);
}

/* ============================================================
   LA FRASE ENTRE LAS LLAMAS · sale al cerrar, antes de que vuelva
   el sobre. Va por encima del lienzo de llamas (z-index 11).
   ============================================================ */
.frase-fuego{
  position:fixed;left:50%;top:44%;
  z-index:12;
  width:min(86vw,560px);
  transform:translate(-50%,-50%) scale(.9);
  text-align:center;
  font-family:var(--serif);
  font-size:clamp(1.9rem,8.6vw,3.1rem);
  font-weight:600;
  line-height:1.16;
  letter-spacing:.01em;
  color:#fff6e2;
  text-shadow:
    0 0 5px  rgba(255,228,160,.95),
    0 0 16px rgba(255,150,40,.9),
    0 0 40px rgba(255,80,0,.8),
    0 0 80px rgba(255,40,0,.55);
  opacity:0;pointer-events:none;
  transition:opacity .55s ease, transform 1s cubic-bezier(.2,.8,.3,1);
}
/* un halo oscuro detrás, para que la frase se lea encima del fuego */
.frase-fuego::before{
  content:'';position:absolute;inset:-30% -12%;
  z-index:-1;border-radius:50%;
  background:radial-gradient(60% 60% at 50% 50%, rgba(18,5,0,.72), rgba(18,5,0,0) 72%);
}
.frase-fuego.ver{
  opacity:1;
  transform:translate(-50%,-50%) scale(1);
  animation:latido-fuego 1.7s ease-in-out infinite;
}
@keyframes latido-fuego{
  0%,100%{filter:brightness(1);}
  45%{filter:brightness(1.18);}
}
@media (prefers-reduced-motion: reduce){
  .frase-fuego.ver{animation:none;}
}

/* Agujeros quemados: van debajo de las fotos, nunca sobre el texto.
   La clave para que no parezcan manchas de café es el centro casi NEGRO
   (como si el fuego hubiera traspasado el papel) con el aro ámbar/tostado
   alrededor, en vez de un marrón suave y parejo. */
.quemadura{
  display:block;
  width:var(--ancho,52%);
  height:clamp(26px,7vw,46px);
  margin:16px auto 4px;
  transform:rotate(var(--gira,0deg));
  background:
    radial-gradient(52% 62% at 50% 50%,
      rgba(8,3,0,.97) 0%,
      rgba(12,5,1,.95) 32%,
      rgba(78,34,7,.92) 50%,
      rgba(168,104,40,.7) 66%,
      rgba(218,182,120,.35) 82%,
      rgba(226,196,140,0) 100%);
  filter:url(#quemadura);
  pointer-events:none;
}

.mono{display:block;width:clamp(56px,15vw,76px);margin:0 auto 18px;}

.encabezado{text-align:center;margin-bottom:clamp(32px,7vw,48px);}
.encabezado .fecha{
  font-size:.6rem;letter-spacing:.3em;text-transform:uppercase;
  color:var(--acento);margin-bottom:14px;
}
.encabezado h1{
  font-family:var(--serif);font-weight:400;
  font-size:clamp(2.1rem,10vw,3rem);
  line-height:1.06;color:var(--texto);
}
.encabezado .linea{
  width:42px;height:1px;background:var(--acento);
  margin:22px auto 0;opacity:.5;
}

p.parrafo{
  font-family:var(--serif);
  font-size:clamp(1.16rem,4.6vw,1.32rem);
  font-weight:400;line-height:1.82;
  color:var(--texto);margin-bottom:1.35em;
}
p.parrafo:first-of-type::first-letter{
  font-size:2.9em;float:left;line-height:.82;
  padding:.06em .09em 0 0;color:var(--acento);font-weight:500;
}
p.parrafo em{font-style:italic;color:#241a1e;}
p.parrafo strong{font-weight:600;color:var(--acento);}

.separador{
  display:flex;align-items:center;justify-content:center;gap:14px;
  margin:clamp(32px,7vw,46px) 0;
  color:var(--acento-claro);
}
.separador::before,.separador::after{
  content:'';height:1px;flex:1;max-width:70px;
  background:currentColor;opacity:.6;
}
.separador .fig-sep{width:38px;}

.cita{text-align:center;margin:clamp(28px,6vw,42px) 0;padding:0 6px;}
.cita p{
  font-family:var(--serif);font-style:italic;font-weight:400;
  font-size:clamp(1.26rem,5.2vw,1.55rem);
  line-height:1.58;color:#241a1e;
}
.cita p::before{content:'“';color:var(--acento);}
.cita p::after{content:'”';color:var(--acento);}

.titulo-seccion{
  font-size:.6rem;letter-spacing:.3em;text-transform:uppercase;
  color:var(--acento);text-align:center;
  margin:clamp(38px,8vw,56px) 0 20px;
}

.lista{list-style:none;}
.lista li{
  font-family:var(--serif);
  font-size:clamp(1.08rem,4.3vw,1.2rem);
  font-weight:400;line-height:1.6;
  padding:13px 0 13px 28px;
  position:relative;
  border-bottom:1px solid var(--renglon);
}
.lista li::before{
  content:'♡';position:absolute;left:2px;top:12px;
  color:var(--acento-claro);font-size:.95rem;
}
.lista li:last-child{border-bottom:none;}

/* --- la hora mágica --- */
.magica{
  position:relative;
  overflow:hidden;
  margin:clamp(38px,8vw,58px) 0;
  padding:clamp(30px,7vw,46px) clamp(20px,5vw,32px);
  text-align:center;
  border-radius:22px;
  background:linear-gradient(165deg, rgba(255,255,255,.8), rgba(224,114,47,.16));
  border:1px solid var(--renglon);
}
.magica::before{
  content:'';
  position:absolute;
  left:50%;top:30%;
  width:min(70%,260px);aspect-ratio:1;
  transform:translate(-50%,-50%);
  background:radial-gradient(circle, rgba(196,69,28,.2), transparent 66%);
  animation:resplandor 4.5s ease-in-out infinite;
  pointer-events:none;
}
@keyframes resplandor{
  0%,100%{opacity:.6;transform:translate(-50%,-50%) scale(1);}
  50%{opacity:1;transform:translate(-50%,-50%) scale(1.15);}
}

.magica .hora{
  position:relative;
  font-family:var(--serif);
  font-size:clamp(2.9rem,15vw,4.4rem);
  font-weight:400;
  line-height:1;
  letter-spacing:.05em;
  color:var(--acento);
  display:inline-flex;
  align-items:center;
  gap:clamp(10px,3vw,18px);
  animation:titilar 3.6s ease-in-out infinite;
}
.magica .hora .chispa{
  font-size:.3em;
  color:var(--acento-claro);
  animation:chispear 2.8s ease-in-out infinite;
}
.magica .hora .chispa:last-child{animation-delay:1.4s;}
@keyframes titilar{
  0%,100%{opacity:.92;text-shadow:0 0 18px rgba(196,69,28,.25);}
  50%{opacity:1;text-shadow:0 0 30px rgba(196,69,28,.5);}
}
@keyframes chispear{
  0%,100%{opacity:.4;transform:scale(.85) rotate(0deg);}
  50%{opacity:1;transform:scale(1.15) rotate(90deg);}
}

.magica .cumple{
  position:relative;
  margin-top:14px;
  font-size:.6rem;
  letter-spacing:.3em;
  text-transform:uppercase;
  color:var(--texto-suave);
}

.magica p{
  position:relative;
  font-family:var(--serif);
  font-size:clamp(1.14rem,4.5vw,1.28rem);
  line-height:1.78;
  color:var(--texto);
  margin-top:1.15em;
}
.magica p strong{font-weight:600;color:var(--acento);}
.magica p em{font-style:italic;color:#241a1e;}
.magica-foto{
  display:block;
  width:min(78%,260px);
  margin:1.3em auto 0;
  border-radius:14px;
  box-shadow:0 12px 26px rgba(15,45,42,.4);
}

.tiempo{
  margin:clamp(34px,7vw,50px) 0;
  padding:clamp(22px,5vw,32px) 0;
  border-top:1px solid var(--renglon);
  border-bottom:1px solid var(--renglon);
}
.hito{display:flex;align-items:center;gap:16px;padding:15px 4px;}
.hito + .hito{border-top:1px dashed var(--renglon);}
.hito .num{
  font-family:var(--serif);
  font-size:clamp(2.3rem,10vw,3rem);

}
.hito .detalle .que{
  font-family:var(--serif);
  font-size:clamp(1.04rem,4.2vw,1.18rem);
  line-height:1.4;color:var(--texto);
}
.hito .detalle .cuando{
  font-size:.6rem;letter-spacing:.18em;text-transform:uppercase;
  color:var(--texto-suave);margin-top:6px;
}
.tiempo .pie{
  text-align:center;
  font-family:var(--serif);font-style:italic;
  font-size:1.02rem;color:var(--acento);margin-top:18px;
}

.firma{margin-top:clamp(38px,8vw,56px);text-align:right;}
.firma .txt{
  font-family:var(--serif);font-style:italic;
  font-size:1.16rem;color:var(--texto-suave);margin-bottom:2px;
}
.firma .yo{
  font-family:var(--mano);
  font-size:clamp(2.2rem,10vw,2.9rem);
  font-weight:600;color:#c4451c;line-height:1.2;
}
.firma .raya{
  width:110px;height:1px;background:rgba(168,42,92,.35);
  margin:6px 0 0 auto;
}

.acciones{
  margin-top:clamp(42px,9vw,62px);
  display:flex;flex-direction:column;gap:12px;align-items:center;
}
.btn{
  width:100%;max-width:18rem;
  padding:15px 24px;
  border:1px solid rgba(196,69,28,.45);
  border-radius:100px;
  font-size:.68rem;letter-spacing:.22em;text-transform:uppercase;
  color:var(--acento);text-align:center;text-decoration:none;
  transition:background .3s ease, transform .15s ease;
  display:block;
}
.btn:active{transform:scale(.97);background:rgba(196,69,28,.1);}
.btn.principal{background:rgba(196,69,28,.12);border-color:rgba(196,69,28,.7);}
.btn.tenue{border-color:rgba(59,42,26,.16);color:var(--texto-suave);}

.respuesta{
  margin-top:28px;text-align:center;
  font-family:var(--serif);font-style:italic;
  font-size:1.18rem;line-height:1.62;color:#241a1e;
  max-height:0;opacity:0;overflow:hidden;
  transition:max-height 1.2s ease, opacity 1.2s ease;
}
.respuesta.ver{max-height:640px;opacity:1;}

/* el mensaje grande del final */
.rs-grande{
  display:block;
  font-family:var(--mano);
  font-style:normal;
  font-size:clamp(2.3rem,11vw,3.2rem);
  font-weight:600;
  line-height:1.15;
  color:var(--acento);
  text-shadow:0 2px 14px rgba(196,69,28,.3);
  margin-bottom:14px;
  opacity:0;
}
.respuesta.ver .rs-grande{animation:surgir .9s cubic-bezier(.2,.8,.3,1) .2s forwards;}

.rs-media{
  display:block;
  font-family:var(--serif);
  font-style:italic;
  font-size:clamp(1.04rem,4.2vw,1.2rem);
  color:var(--texto-suave);
  margin-bottom:8px;
  opacity:0;
}
.respuesta.ver .rs-media{animation:surgir .9s ease .7s forwards;}

.rs-nombre{
  display:block;
  font-family:var(--serif);
  font-style:normal;
  font-size:clamp(1.24rem,5.2vw,1.55rem);
  font-weight:600;
  line-height:1.35;
  color:var(--texto);
  opacity:0;
}
.respuesta.ver .rs-nombre{animation:surgir 1s ease 1.1s forwards;}

.rs-cierre{
  display:block;
  margin-top:16px;
  font-family:var(--serif);
  font-style:italic;
  font-size:1.02rem;
  color:var(--acento);
  opacity:0;
}
.respuesta.ver .rs-cierre{animation:surgir 1s ease 1.7s forwards;}

@keyframes surgir{
  0%{opacity:0;transform:translateY(16px) scale(.94);}
  100%{opacity:1;transform:none;}
}

/* lienzo de los fuegos artificiales */
#fuegos{
  position:fixed;inset:0;
  z-index:40;
  pointer-events:none;
  display:none;
}
#fuegos.ver{display:block;}

/* ============================================================
   CONTROLES
   ============================================================ */
.controles{
  position:fixed;top:calc(var(--safe-t) + 12px);right:14px;
  z-index:20;display:none;gap:8px;
}
.controles.ver{display:flex;}
.ctrl{
  width:38px;height:38px;border-radius:50%;
  border:1px solid rgba(43,35,24,.15);
  background:rgba(255,255,255,.75);
  -webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);
  display:flex;align-items:center;justify-content:center;
  font-size:.92rem;color:var(--texto-suave);
  box-shadow:0 4px 14px rgba(43,35,24,.1);
  transition:color .3s ease, border-color .3s ease, transform .15s ease;
}
.ctrl:active{transform:scale(.9);}
.ctrl.on{color:var(--rosa-luz);border-color:var(--rosa-luz-suave);}

.baja{
  position:fixed;left:50%;bottom:calc(var(--safe-b) + 16px);
  transform:translateX(-50%);
  z-index:15;text-align:center;
  font-size:.58rem;letter-spacing:.26em;text-transform:uppercase;
  color:var(--tinta-clara-suave);
  opacity:0;transition:opacity .8s ease;pointer-events:none;
  text-shadow:0 1px 6px rgba(0,0,0,.6);
}
.baja.ver{opacity:.8;}
.baja .flecha{
  display:block;margin:8px auto 0;width:1px;height:22px;
  background:linear-gradient(var(--rosa-luz), transparent);
  animation:bajar 2.2s ease-in-out infinite;
}
@keyframes bajar{
  0%,100%{transform:translateY(0);opacity:.3;}
  50%{transform:translateY(7px);opacity:1;}
}

.corazon{
  position:fixed;bottom:-40px;z-index:30;
  font-size:18px;pointer-events:none;
  animation:subir linear forwards;
}
@keyframes subir{
  0%{transform:translateY(0) scale(.6);opacity:0;}
  12%{opacity:.9;}
  100%{transform:translateY(-108vh) scale(1.05);opacity:0;}
}

/* ============================================================
   FUEGO · el sobre arde y se transforma en la hoja abierta; al
   cerrar, la hoja arde y se transforma de vuelta en el sobre.
   El fondo (canvas #cielo) hace de grietas/lava mientras arde.
   ============================================================ */
/* el lienzo de las llamas va POR ENCIMA del sobre y de la hoja:
   así el fuego se ve delante, como si de verdad las estuviera quemando */
#llamas{
  position:fixed;left:0;top:0;
  z-index:11;pointer-events:none;
  opacity:0;transition:opacity .35s ease;
}
#llamas.ver{opacity:1;}

/* lo que arde no se aclara: se carboniza y se deshace. Dura ~1s porque
   justo después estalla en trozos (ver lanzarTrozos). */
.ardiendo{
  animation:arder 1.05s ease-in forwards;
}
@keyframes arder{
  0%{filter:none;}
  20%{filter:brightness(.92) sepia(.35) saturate(1.5) hue-rotate(-12deg);}
  50%{filter:brightness(.55) sepia(.75) saturate(2) hue-rotate(-16deg) contrast(1.25);}
  78%{filter:brightness(.25) sepia(1) saturate(2.4) contrast(1.5);opacity:.8;}
  100%{filter:brightness(.04) contrast(2.2);opacity:0;transform:scale(.94);}
}
@media (prefers-reduced-motion: reduce){
  .ardiendo{animation:none;}
}

/* ============================================================
   LOS TROZOS · el sobre (o la hoja) se rompe en pedazos de papel
   quemado que vuelan, giran y se vuelven a juntar formando lo otro.
   Cada trozo es un polígono irregular con la rampa del papel quemado:
   crema por dentro, tostado y casi negro en el filo, con brasa.
   ============================================================ */
.trozos{
  position:fixed;inset:0;z-index:10;
  pointer-events:none;overflow:hidden;
}
.trozo{
  position:absolute;
  left:var(--x0);top:var(--y0);
  width:var(--w);height:var(--h);
  background:
    linear-gradient(var(--luz,150deg),
      rgba(16,7,1,.96) 0%, rgba(74,33,8,.94) 14%,
      rgba(168,108,44,.9) 30%, rgba(226,198,142,.96) 52%,
      var(--papel) 78%);
  box-shadow:0 0 9px rgba(255,120,20,.5), inset 0 0 7px rgba(52,22,4,.55);
  clip-path:var(--forma);
  opacity:0;
  transform:translate(-50%,-50%) rotate(0deg) scale(.7);
  animation:trozo-vuela var(--dur) cubic-bezier(.32,0,.25,1) var(--del) forwards;
  will-change:transform,opacity,left,top;
}
@keyframes trozo-vuela{
  0%{
    left:var(--x0);top:var(--y0);
    transform:translate(-50%,-50%) rotate(0deg) scale(.7);
    opacity:0;
  }
  10%{opacity:1;transform:translate(-50%,-50%) rotate(40deg) scale(1);}
  46%{
    left:var(--xm);top:var(--ym);
    transform:translate(-50%,-50%) rotate(var(--giro1)) scale(1);
    opacity:1;
  }
  84%{opacity:.9;}
  100%{
    left:var(--x1);top:var(--y1);
    transform:translate(-50%,-50%) rotate(var(--giro2)) scale(.5);
    opacity:0;
  }
}
@media (prefers-reduced-motion: reduce){
  .trozo{animation:none;opacity:0;}
}

.brasas{
  position:fixed;inset:0;z-index:9;
  pointer-events:none;overflow:hidden;
}
.brasa{
  position:absolute;
  left:var(--x0);top:var(--y0);
  width:var(--w);height:var(--w);
  border-radius:50%;
  background:radial-gradient(circle, var(--c) 0%, rgba(255,106,61,0) 75%);
  opacity:0;
  transform:translate(-50%,-50%) scale(.4);
  animation:brasa-sube var(--dur) ease-out forwards;
  animation-delay:var(--del);
  will-change:transform,opacity;
}
@keyframes brasa-sube{
  0%{transform:translate(-50%,-50%) scale(.4);opacity:0;}
  14%{opacity:1;transform:translate(-50%,-50%) scale(1);}
  100%{transform:translate(calc(-50% + var(--dx)), calc(-50% - var(--dy))) scale(.15);opacity:0;}
}

/* ============================================================
   STICKERS · cada personaje, recortado de su viñeta
   El recorte se hace aquí, con la imagen dentro de una ventana
   redonda: no hace falta editar ninguna foto.
   ============================================================ */
.sticker{
  position:relative;
  display:block;
  will-change:transform;
}
.sticker img{
  display:block;
  width:100%;
  height:auto;
  filter:drop-shadow(0 9px 18px rgba(15,45,42,.3));
  opacity:0;
  transition:opacity .6s ease;
}
.sticker img.puesta{opacity:1;}

/* variante "foto": fotos reales con marco tipo polaroid, en vez del
   recorte de personaje con blanco ya incluido en el PNG */
.sticker.foto{
  background:#fff;
  padding:8px 8px 22px;
  border-radius:2px;
  box-shadow:0 10px 22px rgba(15,45,42,.28), 0 1px 2px rgba(0,0,0,.12);
}
.sticker.foto img{
  filter:none;
  aspect-ratio:1/1;
  object-fit:cover;
  border-radius:1px;
}

/* los que van entre el texto */
.sticker.centro{
  margin:clamp(26px,6vw,40px) auto;
}
.sticker.centro.lado-izq{margin-left:clamp(6px,4vw,34px);margin-right:auto;}
.sticker.centro.lado-der{margin-right:clamp(6px,4vw,34px);margin-left:auto;}

/* Los que se asoman por el borde de la hoja.
   z-index negativo: quedan por encima del papel pero POR DEBAJO del texto,
   así nunca tapan una línea aunque se metan un poco. */
.sticker.pegado{
  position:absolute;
  z-index:-1;
}

/* --- los movimientos, según lo que esté haciendo cada uno --- */

/* ballet: la pirueta */
.st-ballet{animation:st-ballet 7s ease-in-out infinite;}
@keyframes st-ballet{
  0%,100%{transform:rotate(var(--base,0deg)) translateY(0) scale(1);}
  25%{transform:rotate(calc(var(--base,0deg) + 8deg)) translateY(-11px) scale(1.03);}
  50%{transform:rotate(var(--base,0deg)) translateY(-15px) scale(1.05);}
  75%{transform:rotate(calc(var(--base,0deg) - 8deg)) translateY(-11px) scale(1.03);}
}

/* tomar: echa la cabeza atrás y sorbe */
.st-beber{animation:st-beber 4.5s ease-in-out infinite;}
@keyframes st-beber{
  0%,52%,100%{transform:rotate(var(--base,0deg)) translateY(0);}
  68%{transform:rotate(calc(var(--base,0deg) - 10deg)) translateY(-5px);}
  84%{transform:rotate(calc(var(--base,0deg) - 5deg)) translateY(-2px);}
}

/* comer: el mordisco */
.st-comer{animation:st-comer 3.4s ease-in-out infinite;}
@keyframes st-comer{
  0%,42%,100%{transform:rotate(var(--base,0deg)) scale(1);}
  54%{transform:rotate(var(--base,0deg)) scale(1.08);}
  64%{transform:rotate(var(--base,0deg)) scale(.97);}
  76%{transform:rotate(var(--base,0deg)) scale(1.05);}
}

/* cargar: le pesa la bolsa y se balancea */
.st-cargar{animation:st-cargar 5s ease-in-out infinite;}
@keyframes st-cargar{
  0%,100%{transform:rotate(calc(var(--base,0deg) - 5deg)) translateY(0);}
  50%{transform:rotate(calc(var(--base,0deg) + 5deg)) translateY(-6px);}
}

/* echado: solo respira */
.st-dormir{animation:st-dormir 6.5s ease-in-out infinite;}
@keyframes st-dormir{
  0%,100%{transform:rotate(var(--base,0deg)) scale(1);}
  50%{transform:rotate(var(--base,0deg)) scale(1.05);}
}

/* saltar: como la rana que es */
.st-saltar{animation:st-saltar 4s ease-in-out infinite;}
@keyframes st-saltar{
  0%,50%,100%{transform:rotate(var(--base,0deg)) translateY(0) scale(1,1);}
  58%{transform:rotate(var(--base,0deg)) translateY(0) scale(1.09,.89);}
  70%{transform:rotate(var(--base,0deg)) translateY(-28px) scale(.92,1.1);}
  86%{transform:rotate(var(--base,0deg)) translateY(0) scale(1.07,.93);}
}

/* deslizarse: pasa de un lado a otro */
.st-desliza{animation:st-desliza 8s ease-in-out infinite;}
@keyframes st-desliza{
  0%{transform:rotate(calc(var(--base,0deg) - 3deg)) translateX(-28px);}
  50%{transform:rotate(calc(var(--base,0deg) + 3deg)) translateX(28px);}
  100%{transform:rotate(calc(var(--base,0deg) - 3deg)) translateX(-28px);}
}

/* flotar: el que va en la nube */
.st-flotar{animation:st-flotar 9s ease-in-out infinite;}
@keyframes st-flotar{
  0%,100%{transform:rotate(var(--base,0deg)) translate(0,0);}
  33%{transform:rotate(calc(var(--base,0deg) - 4deg)) translate(-10px,-14px);}
  66%{transform:rotate(calc(var(--base,0deg) + 4deg)) translate(10px,-7px);}
}

/* brincar: el juguetón */
.st-brinco{animation:st-brinco 3.6s ease-in-out infinite;}
@keyframes st-brinco{
  0%,60%,100%{transform:rotate(var(--base,0deg)) translateY(0) scaleY(1);}
  15%{transform:rotate(var(--base,0deg)) translateY(-16px) scaleY(1.04);}
  30%{transform:rotate(var(--base,0deg)) translateY(0) scaleY(.96);}
  45%{transform:rotate(var(--base,0deg)) translateY(-8px) scaleY(1.02);}
}

/* brillar: la de los diamantes */
.st-brilla{animation:st-brilla 5.5s ease-in-out infinite;}
@keyframes st-brilla{
  0%,100%{transform:rotate(var(--base,0deg)) scale(1);filter:brightness(1);}
  50%{transform:rotate(var(--base,0deg)) scale(1.05);filter:brightness(1.14) saturate(1.1);}
}

@media (prefers-reduced-motion: reduce){
  *{animation-duration:.01ms !important;animation-iteration-count:1 !important;transition-duration:.25s !important;}
  #hoja{opacity:1;transform:none;}
}
</style>
</head>

<body>

<!-- el ruido que le come el contorno a las quemaduras, para que se vean
     mordidas por el fuego y no recortadas -->
<svg width="0" height="0" aria-hidden="true" style="position:absolute">
  <filter id="quemadura" x="-25%" y="-25%" width="150%" height="150%">
    <feTurbulence type="fractalNoise" baseFrequency="0.028" numOctaves="4" seed="9" result="ruido"/>
    <feDisplacementMap in="SourceGraphic" in2="ruido" scale="12"
                       xChannelSelector="R" yChannelSelector="G"/>
  </filter>
</svg>

<canvas id="cielo"></canvas>
<canvas id="llamas"></canvas>
<canvas id="fuegos"></canvas>

<!-- ══════════ LA HOJA ══════════ -->
<article id="hoja">

  <header class="encabezado">
    <svg class="mono" viewBox="0 0 100 58" aria-hidden="true">
      <path d="M50,6 C58,15 70,21 70,32 C70,42 60,50 50,50 C40,50 30,42 30,32 C30,26 34,22 40,19 C38,25 41,29 45,28 C43,22 45,15 50,6 Z" fill="#c4451c"/>
      <path d="M50,20 C55,26 61,30 60,37 C59,44 54,48 49,47 C44,46 41,42 43,37 C44,39 46,40 48,39 C46,33 47,26 50,20 Z" fill="#ffb347"/>
    </svg>
    <div class="fecha" id="fecha-hoy"></div>
    <h1 id="nombre-carta">Mi amor</h1>
    <div class="linea"></div>
  </header>

  <div id="cuerpo-1"></div>
  <div class="punto" id="p1"></div>

  <div class="cita"><p id="cita-1"></p></div>
  <div class="punto" id="p2"></div>

      caja.style.width = (s.tam || 130) + 'px';
      if (s.quien) caja.setAttribute('aria-label', s.quien);

      const img = document.createElement('img');
      img.alt = '';
      img.decoding = 'async';
      img.loading  = 'lazy';
      img.addEventListener('load', () => img.classList.add('puesta'));

      // Se prueban varias rutas: da igual si los stickers están dentro de
      // la carpeta "img" o sueltos junto al index.html. Si no aparece por
      // ningún lado, el sticker se quita solo en vez de dejar la imagen rota.
      const soloNombre = s.img.split('/').pop();
      const rutas = [s.img];
      if (s.img.indexOf('/') > -1) rutas.push(soloNombre);
      else rutas.push('img/' + soloNombre);

      let intento = 0;
      img.addEventListener('error', () => {
        intento++;
        if (intento < rutas.length) img.src = encodeURI(rutas[intento]);
        else caja.remove();
      });

      img.src = encodeURI(rutas[0]);
      if (img.complete && img.naturalWidth) img.classList.add('puesta');

      caja.appendChild(img);

      if (s.en === 'izq' || s.en === 'der'){
        caja.classList.add('pegado');
        caja.style.top = s.y || '20%';
        // se sale casi todo del papel: lo poco que entra cae en el margen,
        // donde no hay texto que estorbar
        const fuera = 'calc(-' + (s.tam || 88) + 'px * 0.72)';
        if (s.en === 'izq') caja.style.left  = fuera;
        else                caja.style.right = fuera;
        hoja.appendChild(caja);
      } else {
        const punto = document.getElementById(s.en || 'p1');
        if (!punto) return;
        caja.classList.add('centro');
        if (s.lado === 'izq') caja.classList.add('lado-izq');
        if (s.lado === 'der') caja.classList.add('lado-der');
        punto.appendChild(caja);
      }
    });
  }

  /* --- movimiento en profundidad al deslizar --- */
  let parallaxListo = false;

  function montarParallax(){
    if (menosMovimiento || parallaxListo) return;   // que no se duplique al reabrir

    const figs = Array.prototype.slice.call(document.querySelectorAll('.decor .fig'));
    if (!figs.length) return;
    parallaxListo = true;

    // guardar la profundidad una sola vez, así no la parseamos en cada frame
    const capas = figs.map(f => ({
      el: f,
      prof: parseFloat(f.dataset.prof) || 0.15,
      x: 0    // posición actual, que va persiguiendo a "y" con suavizado
    }));

    let objetivo = cuantoBajo();
    let corriendo = false;

    // rAF continuo mientras la posición "actual" no haya alcanzado al scroll.
    // Con lerp de 0.16: cada frame se acerca un 16% al objetivo. El movimiento
    // queda tipo mantequilla en vez de saltar en escalones.
    function tick(){
      let vivo = false;
      for (let i = 0; i < capas.length; i++){
        const c = capas[i];
        const meta = -objetivo * c.prof;
        const dif = meta - c.x;
        if (Math.abs(dif) > 0.08){
          c.x += dif * 0.16;
          vivo = true;
        } else {
          c.x = meta;
        }
        // translate3d fuerza aceleración por GPU (no se puede animar 'top')
        c.el.style.transform = 'translate3d(0,' + c.x.toFixed(2) + 'px,0)';
      }
      if (vivo) requestAnimationFrame(tick);
      else corriendo = false;
    }

    function arrancar(){
      objetivo = cuantoBajo();
      if (!corriendo){
        corriendo = true;
        requestAnimationFrame(tick);
      }
    }

    // scroll pasivo: iOS lo dispara con hueco al frenar, pero rAF sigue
    // suavizando entre eventos hasta que la posición cuadra
    window.addEventListener('scroll', arrancar, { passive: true });
    window.addEventListener('resize', arrancar);

    // primera pasada, sin animación (para que salgan ya en su sitio)
    capas.forEach(c => {
      c.x = -objetivo * c.prof;
      c.el.style.transform = 'translate3d(0,' + c.x + 'px,0)';
    });
  }

  /* ============================================================
     2. LOS TEXTOS
     ============================================================ */
  function pintar(sel, lista){
    $(sel).innerHTML = lista.map(t => '<p class="parrafo">' + t + '</p>').join('');

  $('#nombre-portada').textContent  = CARTA.ella;

  $('#sello-texto').textContent     = CARTA.inicialSello;

  $('#despedida').textContent       = CARTA.despedida;
  $('#cita-1').textContent          = CARTA.cita1;
  $('#cita-2').textContent          = CARTA.cita2;
  $('#btn-perdon').textContent      = CARTA.textoBoton;

  $('#hora-magica').textContent     = CARTA.horaMagica;

  const meses = ['enero','febrero','marzo','abril','mayo','junio','julio',

  $('#hitos').innerHTML = hitos.map((h, i) =>
    '<div class="hito">' +
      '<div class="num" id="num-' + i + '">0</div>' +

  if (CARTA.whatsapp && CARTA.whatsapp.trim() !== ''){

             '?text=' + encodeURIComponent(CARTA.mensajeWhatsapp);

  montarStickers();

  /* --- QUEMADURAS DE LA HOJA ---
     Van DESPUÉS de cada foto (dentro de los puntos p1..p8), nunca sobre
     el texto: son manchas de chamusquina con un filtro de ruido que les
     come el contorno, así se ven quemadas y no recortadas. */
  function ponerQuemaduras(){
    const puntos = ['p2', 'p4', 'p6', 'p8'];
    puntos.forEach((id, i) => {
      const zona = document.getElementById(id);
      if (!zona || !zona.children.length) return;   // solo donde hay foto
      const q = document.createElement('div');
      q.className = 'quemadura';

  ponerQuemaduras();

  /* ============================================================
     3. FONDO, LAVA Y FUEGO
     Dos lienzos:
       #cielo  (atrás)   → el suelo. Blanco; al abrir/cerrar se agrieta
                           como lava (venas rojas + resplandor) y al final
                           queda blanco con las grietas ya apagadas.
       #llamas (delante) → las llamas de verdad, POR ENCIMA del sobre y de
                           la hoja, para que se vea que se están quemando.
     El fuego es el algoritmo clásico: cada celda hereda la de abajo con un
     decaimiento al azar. El buffer tiene POCAS filas a propósito (cada
     celda es alta), porque si no la llama solo alcanza el borde de abajo
     de la pantalla y se ve como puntitos.
     ============================================================ */
  const canvas = $('#cielo');
  const ctx = canvas.getContext('2d', { alpha: false });
  const cvLlamas = $('#llamas');
  const ctxLlamas = cvLlamas.getContext('2d');
  let ancho = 0, alto = 0, altoLienzo = 0, animando = true;

  const FW = 110, FH = 60;
  const fuego = new Uint8Array(FW * FH);
  const fuegoCv = document.createElement('canvas');
  fuegoCv.width = FW; fuegoCv.height = FH;
  const fuegoCx = fuegoCv.getContext('2d');
  const bufferRGBA = new Uint8ClampedArray(FW * FH * 4);

  // paleta de lava (40 tonos): apagado → rojo → naranja → amarillo → blanco
  const PALETA_FUEGO = (function(){
    const claves = [
      [0,0,0,0], [46,6,2,110], [104,12,3,180], [158,28,5,215],
      [208,56,8,238], [240,100,14,250], [255,146,28,255],
      [255,192,72,255], [255,228,140,255], [255,250,224,255]
    ];
    const total = 40, salida = [];
    for (let i = 0; i < total; i++){
      const p = i / (total - 1) * (claves.length - 1);
      const a = claves[Math.floor(p)];
      const b = claves[Math.min(claves.length - 1, Math.ceil(p))];
      const f = p - Math.floor(p);
      salida.push([
        Math.round(a[0] + (b[0] - a[0]) * f),
        Math.round(a[1] + (b[1] - a[1]) * f),
        Math.round(a[2] + (b[2] - a[2]) * f),
        Math.round(a[3] + (b[3] - a[3]) * f)
      ]);
    }
    return salida;
  })();
  const MAXI = PALETA_FUEGO.length - 1;

  let modoFuego = 'limpio';   // 'limpio' | 'ardiendo' | 'enfriando' | 'cenizas'
  let tFuego = 0;
  let grietas = [];           // las venas de lava del suelo
  let zonaArde = null;        // el rect (px) de lo que se está quemando
  let repintarFondo = true;

  function dimensionar(){
    const dpr = Math.min(window.devicePixelRatio || 1, 2);

    ancho = vw();
    alto  = vh();              // el alto de verdad, para comparar

    // el lienzo se hace más alto a propósito: cuando Safari esconde su barra
    // la pantalla crece, y así no aparece una franja vacía abajo
    altoLienzo = alto + 160;

    canvas.width  = Math.floor(ancho * dpr);
    canvas.height = Math.floor(altoLienzo * dpr);
    canvas.style.width  = ancho + 'px';
    canvas.style.height = altoLienzo + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    // el de las llamas va a menos resolución: igual se ve borroso al escalar
    cvLlamas.width  = Math.floor(ancho * 0.7);
    cvLlamas.height = Math.floor(altoLienzo * 0.7);
    cvLlamas.style.width  = ancho + 'px';
    cvLlamas.style.height = altoLienzo + 'px';
    ctxLlamas.setTransform(0.7, 0, 0, 0.7, 0, 0);

    repintarFondo = true;
  }

  /* --- las grietas de lava: ramas que salen de donde se prende --- */
  function generarGrietas(cx0, cy0){
    const lista = [];
    const ramas = 9;
    for (let r = 0; r < ramas; r++){
      let ang = (Math.PI * 2 * r) / ramas + Math.random() * 0.7;
      let x = cx0, y = cy0;
      const pts = [{ x: x, y: y }];
      const pasos = 16 + Math.floor(Math.random() * 10);
      for (let i = 0; i < pasos; i++){
        ang += (Math.random() - 0.5) * 0.85;
        const largo = 22 + Math.random() * 48;
        x += Math.cos(ang) * largo;
        y += Math.sin(ang) * largo;
        pts.push({ x: x, y: y });

        // de vez en cuando la grieta se parte en dos
        if (i > 2 && Math.random() < 0.22){
          let ax = x, ay = y;
          let aang = ang + (Math.random() < 0.5 ? 1 : -1) * (0.5 + Math.random() * 0.6);
          const sub = [{ x: ax, y: ay }];
          const subPasos = 4 + Math.floor(Math.random() * 7);
          for (let j = 0; j < subPasos; j++){
            aang += (Math.random() - 0.5) * 0.8;
            ax += Math.cos(aang) * (16 + Math.random() * 34);
            ay += Math.sin(aang) * (16 + Math.random() * 34);
            sub.push({ x: ax, y: ay });
          }
          lista.push({ pts: sub, grosor: 0.55 });
        }
      }
      lista.push({ pts: pts, grosor: 1 });
    }
    return lista;
  }

  /* Las grietas se pintan UNA vez en lienzos aparte (calientes y frías) y
     después solo se copian: pintar ~100 trazos anchos en cada frame ahogaría
     al teléfono. El "se van abriendo" se hace recortando con un círculo que
     crece desde donde se prendió. */
  let grietasCv = null, grietasFriasCv = null;

  function pintarGrietasEn(cx2, capas){
    cx2.lineCap = 'round';
    cx2.lineJoin = 'round';
    for (let k = 0; k < grietas.length; k++){
      const g = grietas[k];
      for (let c = 0; c < capas.length; c++){
        cx2.beginPath();
        cx2.moveTo(g.pts[0].x, g.pts[0].y);
        for (let i = 1; i < g.pts.length; i++) cx2.lineTo(g.pts[i].x, g.pts[i].y);
        cx2.lineWidth = capas[c][0] * g.grosor;
        cx2.strokeStyle = capas[c][1];
        cx2.stroke();
      }
    }
  }

  function prepararGrietas(){
    const w = Math.max(1, Math.floor(ancho)), h = Math.max(1, Math.floor(altoLienzo));

    grietasCv = document.createElement('canvas');
    grietasCv.width = w; grietasCv.height = h;
    pintarGrietasEn(grietasCv.getContext('2d'), [
      [26,  'rgba(255,70,0,.2)'],
      [11,  'rgba(255,120,10,.5)'],
      [4.5, 'rgba(255,190,80,.85)'],
      [1.6, 'rgba(255,245,215,.95)']
    ]);

    grietasFriasCv = document.createElement('canvas');
    grietasFriasCv.width = w; grietasFriasCv.height = h;
    pintarGrietasEn(grietasFriasCv.getContext('2d'), [
      [3.4, 'rgba(78,44,26,.14)'],
      [1.2, 'rgba(126,48,16,.26)']
    ]);
  }

  // zona: el rect en pantalla de lo que se quema (sobre u hoja)
  function iniciarIncendio(zona){
    zonaArde = zona;
    grietas = generarGrietas(zona.left + zona.width / 2, zona.top + zona.height * 0.72);
    prepararGrietas();
    modoFuego = 'ardiendo';
    tFuego = 0;
    fuego.fill(0);
    cvLlamas.classList.add('ver');
  }

  function apagarIncendio(){
    modoFuego = 'enfriando';
    tFuego = 0;
    // la fila de abajo no la toca la propagación: hay que apagarla a mano
    for (let x = 0; x < FW; x++) fuego[(FH - 1) * FW + x] = 0;
    cvLlamas.classList.remove('ver');
  }

  function pasoFuego(){
    tFuego++;

    if (modoFuego === 'ardiendo'){
      // 1) lo que se está quemando: banda caliente en su base, para que
      //    la llama salga justo de ahí y lo envuelva
      if (zonaArde){
        const x1 = Math.max(0, Math.floor(zonaArde.left / ancho * FW));
        const x2 = Math.min(FW - 1, Math.ceil((zonaArde.left + zonaArde.width) / ancho * FW));
        const yb = Math.min(FH - 1, Math.max(1,
          Math.round((zonaArde.top + zonaArde.height) / altoLienzo * FH)));
        // fuerte mientras se consume, y después baja a una cama de fuego:
        // si no, la pantalla queda tapada de llamas y no se lee la frase
        const fuerza = tFuego < 75 ? 0.92 : 0.32;
        for (let x = x1; x <= x2; x++){
          if (Math.random() < fuerza) fuego[yb * FW + x] = MAXI;
        }
      }
      // 2) el suelo: la lava prende abajo y se va ensanchando. Solo al
      //    principio: si siguiera, la pantalla se queda tapada de fuego y
      //    ya no se ve nada de lo que se está quemando.
      if (tFuego < 46){
        const cx0 = zonaArde ? (zonaArde.left + zonaArde.width / 2) / ancho * FW : FW / 2;
        const abarca = Math.min(FW, 12 + tFuego * 3);
        for (let i = 0; i < abarca; i++){
          const x = Math.round(cx0 + (Math.random() - 0.5) * abarca);
          if (x >= 0 && x < FW) fuego[(FH - 1) * FW + x] = MAXI;
        }
      }
    }

    for (let x = 0; x < FW; x++){
      for (let y = 1; y < FH; y++){
        const val = Math.max(0, fuego[y * FW + x] - (Math.random() < 0.8 ? 1 : 0));
        const dx = Math.random() < 0.5 ? 0 : (Math.random() < 0.5 ? -1 : 1);
        const dstX = Math.min(FW - 1, Math.max(0, x + dx));
        fuego[(y - 1) * FW + dstX] = val;
      }
    }
  }

  function dibujarLlamas(){
    ctxLlamas.clearRect(0, 0, ancho, altoLienzo);
    for (let i = 0, n = FW * FH; i < n; i++){
      const col = PALETA_FUEGO[fuego[i]];
      const o = i * 4;
      bufferRGBA[o] = col[0]; bufferRGBA[o + 1] = col[1];
      bufferRGBA[o + 2] = col[2]; bufferRGBA[o + 3] = col[3];
    }
    fuegoCx.putImageData(new ImageData(bufferRGBA, FW, FH), 0, 0);
    ctxLlamas.imageSmoothingEnabled = true;
    ctxLlamas.drawImage(fuegoCv, 0, 0, FW, FH, 0, 0, ancho, altoLienzo);
  }

  function dibujarFondo(){
    if (modoFuego === 'ardiendo' || modoFuego === 'enfriando'){
      // el suelo blanco se vuelve casi negro (con tinte rojo, no café)
      const p = modoFuego === 'ardiendo'
        ? Math.min(1, tFuego / 26)
        : Math.max(0, 1 - tFuego / 45);
      ctx.fillStyle = 'rgb(' + Math.round(251 - p * 227) + ',' +
                               Math.round(250 - p * 240) + ',' +
                               Math.round(246 - p * 240) + ')';
      ctx.fillRect(0, 0, ancho, altoLienzo);

      // el resplandor de la lava, saliendo de donde se prendió
      if (zonaArde && p > 0.04){
        const gx = zonaArde.left + zonaArde.width / 2;
        const gy = zonaArde.top + zonaArde.height * 0.72;
        const g = ctx.createRadialGradient(gx, gy, 0, gx, gy, Math.max(ancho, altoLienzo) * 0.85);
        g.addColorStop(0,    'rgba(255,95,10,' + (0.4 * p) + ')');
        g.addColorStop(0.45, 'rgba(178,32,4,'  + (0.2 * p) + ')');
        g.addColorStop(1,    'rgba(60,8,0,0)');
        ctx.fillStyle = g;
        ctx.fillRect(0, 0, ancho, altoLienzo);
      }

      // las grietas se revelan con un círculo que crece desde el origen
      if (grietasCv && zonaArde){
        const gx2 = zonaArde.left + zonaArde.width / 2;
        const gy2 = zonaArde.top + zonaArde.height * 0.72;
        const avance = modoFuego === 'ardiendo' ? Math.min(1, tFuego / 20) : 1;
        const brillo = modoFuego === 'ardiendo'
          ? Math.min(1, tFuego / 12)
          : Math.max(0, 1 - tFuego / 40);

        ctx.save();
        ctx.beginPath();
        ctx.arc(gx2, gy2, avance * Math.max(ancho, altoLienzo) * 1.2, 0, 6.2832);
        ctx.clip();
        ctx.globalAlpha = brillo;
        ctx.drawImage(grietasCv, 0, 0, ancho, altoLienzo);
        ctx.restore();
        ctx.globalAlpha = 1;
      }

      if (modoFuego === 'enfriando' && tFuego > 46){
        modoFuego = 'cenizas';
        repintarFondo = true;
      }
    } else {
      ctx.fillStyle = '#fbfaf6';
      ctx.fillRect(0, 0, ancho, altoLienzo);
      // quedan las marcas de por dónde pasó la lava
      if (modoFuego === 'cenizas' && grietasFriasCv){
        ctx.drawImage(grietasFriasCv, 0, 0, ancho, altoLienzo);
      }
      repintarFondo = false;
    }
  }

  function dibujar(){
    if (!animando) return;

    // OJO: en iPhone, al deslizar, Safari esconde y saca la barra de direcciones
    // y eso cambia la altura de la ventana. Si redibujáramos por cada cambio,
    // el fondo daría un tirón en cada scroll. Solo se rehace si gira el
    // teléfono (cambia el ancho) o si el alto cambia muchísimo.
    if (Math.abs(vw() - ancho) > 2 || Math.abs(vh() - alto) > 140) dimensionar();

    if (modoFuego === 'ardiendo' || modoFuego === 'enfriando'){
      pasoFuego();
      dibujarFondo();
      dibujarLlamas();
    } else if (repintarFondo){
      dibujarFondo();
      ctxLlamas.clearRect(0, 0, ancho, altoLienzo);
    }

    requestAnimationFrame(dibujar);
  }

  dimensionar();
  dibujar();

  window.addEventListener('resize', () => {
    if (Math.abs(vw() - ancho) > 2 || Math.abs(vh() - alto) > 140) dimensionar();
  });
  window.addEventListener('orientationchange', () => setTimeout(dimensionar, 250));

  document.addEventListener('visibilitychange', () => {
    if (document.hidden){ animando = false; }
    else if (!animando){ animando = true; dibujar(); }
  });

  /* ============================================================
     4. ABRIR EL SOBRE
     ============================================================ */
  const sobre  = $('#sobre');
  const escena = $('#escena');
  const hoja   = $('#hoja');
  let abierto = false;
  let pendientes = [];          // los tiempos de la apertura, por si cierra antes

  function agendar(fn, ms){
    pendientes.push(setTimeout(fn, ms));
  }

  /* --- TROZOS ---
     Lo que se quema se rompe en pedazos de papel quemado: salen de
     `origen`, estallan hacia afuera girando y después se juntan sobre
     `destino`, que es donde va a aparecer lo otro. Así se ve que el sobre
     se convirtió en la carta (y al revés al cerrar), en vez de que una
     cosa desaparezca y la otra salga de la nada. */
  function formaTrozo(){
    const n = 5 + Math.floor(Math.random() * 3);
    const pts = [];
    for (let i = 0; i < n; i++){
      const a = (Math.PI * 2 * i) / n + Math.random() * 0.5;
      const r = 32 + Math.random() * 18;
      pts.push(Math.round(50 + Math.cos(a) * r) + '% ' + Math.round(50 + Math.sin(a) * r) + '%');
    }
    return 'polygon(' + pts.join(',') + ')';
  }

  function lanzarTrozos(origen, destino, opciones, cb){
    const op = opciones || {};
    if (menosMovimiento){ if (cb) cb(); return; }

    const capa = document.createElement('div');
    capa.className = 'trozos';
    document.body.appendChild(capa);

    const N = op.n || 74;
    const base = op.dur || 1.5;
    let fin = 0;

    for (let i = 0; i < N; i++){
      const t = document.createElement('span');
      t.className = 'trozo';

      const x0 = origen.left + Math.random() * origen.width;
      const y0 = origen.top + Math.random() * origen.height;

      // estalla hacia afuera, con un empujón hacia arriba (el fuego sube)
      const ang = Math.random() * Math.PI * 2;
      const radio = 80 + Math.random() * 170;
      const xm = x0 + Math.cos(ang) * radio;
      const ym = y0 + Math.sin(ang) * radio - 50;

      // y termina repartido por donde va a estar lo otro
      const x1 = destino.left + Math.random() * destino.width;
      const y1 = destino.top + Math.random() * destino.height;

      const lado = 11 + Math.random() * 17;
      const dur = base + Math.random() * 0.5;
      const del = Math.random() * (op.reparto || 0.4);
      fin = Math.max(fin, dur + del);

      t.style.setProperty('--x0', x0 + 'px');
      t.style.setProperty('--y0', y0 + 'px');
      t.style.setProperty('--xm', xm + 'px');
      t.style.setProperty('--ym', ym + 'px');
      t.style.setProperty('--x1', x1 + 'px');
      t.style.setProperty('--y1', y1 + 'px');
      t.style.setProperty('--w', lado + 'px');
      t.style.setProperty('--h', (lado * (0.6 + Math.random() * 0.7)) + 'px');
      t.style.setProperty('--giro1', (140 + Math.random() * 220) + 'deg');
      t.style.setProperty('--giro2', (320 + Math.random() * 420) + 'deg');
      t.style.setProperty('--luz', Math.round(Math.random() * 360) + 'deg');
      t.style.setProperty('--forma', formaTrozo());
      t.style.setProperty('--dur', dur + 's');
      t.style.setProperty('--del', del + 's');

      capa.appendChild(t);
    }

    setTimeout(() => { capa.remove(); if (cb) cb(); }, fin * 1000 + 140);
  }

  // dónde va a caer la hoja cuando aparezca (todavía no está en pantalla,
  // así que se calcula igual que su CSS: centrada y arriba)
  function zonaHoja(){
    const w = Math.min(vw() * 0.88, 640);
    return { left: (vw() - w) / 2, width: w, top: vh() * 0.1, height: vh() * 0.62 };
  }

  /* --- BRASAS ---
     Chispas que suben desde el sobre (o la hoja) mientras arden,
     además del fuego del fondo. */
  function lanzarBrasas(origen){
    if (menosMovimiento) return;

    const capa = document.createElement('div');
    capa.className = 'brasas';
    document.body.appendChild(capa);

    const colores = ['#ff6a3d', '#ffb347', '#ff3d1f', '#ffe08a', '#c4451c'];
    const N = 70;
    let maxFin = 0;

    for (let i = 0; i < N; i++){
      const b = document.createElement('span');
      b.className = 'brasa';

      const x0 = origen.left + Math.random() * origen.width;
      const y0 = origen.top + Math.random() * origen.height;
      const dur = 0.9 + Math.random() * 0.6;
      const del = Math.random() * 0.35;
      maxFin = Math.max(maxFin, dur + del);

      b.style.setProperty('--x0', x0 + 'px');
      b.style.setProperty('--y0', y0 + 'px');
      b.style.setProperty('--dx', ((Math.random() - 0.5) * 70) + 'px');
      b.style.setProperty('--dy', (60 + Math.random() * 150) + 'px');
      b.style.setProperty('--w', (4 + Math.random() * 7) + 'px');
      b.style.setProperty('--c', colores[Math.floor(Math.random() * colores.length)]);
      b.style.setProperty('--dur', dur + 's');
      b.style.setProperty('--del', del + 's');

      capa.appendChild(b);
    }

    setTimeout(() => capa.remove(), maxFin * 1000 + 150);
  }

  /* --- ABRIR: el sobre arde y se transforma en la hoja --- */
  function abrir(){
    if (abierto) return;
    abierto = true;

    pendientes.forEach(clearTimeout);
    pendientes = [];

    // por si estaba a medio guardarse, se borra el rastro del cierre
    hoja.classList.remove('guardando');
    sobre.classList.remove('cerrando');

    // se mide antes de que el sobre empiece a arder
    const origenSobre = sobre.getBoundingClientRect();

    vibrar(12);

    // El toque de ella es el gesto que iOS exige para dejar sonar el audio.
    // Cada vez que abre la carta, la canción empieza desde el principio.
    rebobinarCancion();
    arrancarMusica();

    // primero se abre la lava, y recién ahí se prende el sobre: así se ve
    // que fue la lava la que lo quemó
    escena.classList.add('abriendo');
    if (!menosMovimiento) iniciarIncendio(origenSobre);

    agendar(() => {
      sobre.classList.add('ardiendo');
      lanzarBrasas(origenSobre);
      vibrar(18);
    }, 420);

    agendar(() => $('#velo').classList.add('ver'), 900);

    // el sobre, ya carbonizado, se rompe en pedazos que vuelan
    agendar(() => {
      escena.classList.add('fuera');
      escena.style.display = 'none';
      sobre.classList.remove('ardiendo');
      lanzarTrozos(origenSobre, zonaHoja(), { dur: 1.5 });
      vibrar(22);
    }, 1450);

    // ...y donde caen los pedazos, aparece la hoja armada
    agendar(() => {
      if (!menosMovimiento) apagarIncendio();
      vibrar(16);
      hoja.classList.add('abierta');
      activarScroll();
      agendar(() => hoja.classList.add('ver'), 40);
      $('#controles').classList.add('ver');
      montarParallax();

      agendar(() => {
        vigilarNumeros();
        $('#baja').classList.add('ver');
      }, 700);
    }, 2750);

    // Red de seguridad: pase lo que pase, la hoja se ve.
    agendar(() => {
      hoja.classList.add('abierta', 'ver');
      activarScroll();
      if (parseFloat(getComputedStyle(hoja).opacity) < 0.95){
        hoja.style.transition = 'none';
        hoja.style.opacity = '1';
        hoja.style.transform = 'none';
      }
    }, 4200);
  }

  /* --- CERRAR: la hoja arde y se transforma de vuelta en el sobre.
     La música se va apagando durante el mismo incendio, no de golpe. */
  function cerrar(){
    if (!abierto) return;
    abierto = false;

    pendientes.forEach(clearTimeout);
    pendientes = [];
    if (soltarNumeros) soltarNumeros();

    vibrar(10);
    apagarFuegos();
    window.scrollTo(0, 0);

    $('#velo').classList.remove('ver');
    $('#controles').classList.remove('ver');
    $('#baja').classList.remove('ver');
    $('#respuesta').classList.remove('ver');

    // se mide antes de que la hoja empiece a arder; lo que se ve en
    // pantalla, no la hoja entera (que es larguísima y sale del viewport)
    const r = hoja.getBoundingClientRect();
    const origenHoja = {
      left: r.left,
      width: r.width,
      top: Math.max(0, r.top),
      height: Math.min(r.bottom, vh()) - Math.max(0, r.top)
    };

    // la escena queda lista (todavía invisible, por la clase "fuera")
    // para que aparezca el sobre en cuanto termine el incendio
    escena.style.display = '';

    if (!menosMovimiento) iniciarIncendio(origenHoja);

    agendar(() => {
      hoja.classList.add('ardiendo');
      lanzarBrasas(origenHoja);
      vibrar(18);
    }, 380);

    // la hoja carbonizada se rompe en pedazos, que se van juntando sobre
    // el sobre mientras la frase está en pantalla
    const destinoSobre = sobre.getBoundingClientRect();
    agendar(() => {
      hoja.classList.remove('abierta', 'ver');
      lanzarTrozos(origenHoja, destinoSobre, { dur: 2.3, n: 84, reparto: .7 });
      vibrar(22);
    }, 1400);

    // entre las llamas, mientras los pedazos vuelan, sale la frase
    const frase = $('#frase-fuego');
    agendar(() => frase.classList.add('ver'), 1750);
    agendar(() => frase.classList.remove('ver'), 3550);

    if (!menosMovimiento) bajarVolumen(3900);
    else pararMusica();

    agendar(() => {
      if (!menosMovimiento) apagarIncendio();
      frase.classList.remove('ver');

      hoja.style.transition = '';
      hoja.style.opacity = '';
      hoja.style.transform = '';
      hoja.classList.remove('ardiendo', 'abierta', 'ver', 'guardando');

      // el sobre "aparece" ya cerrado, justo cuando termina el incendio
      escena.classList.remove('fuera', 'abriendo');
      sobre.classList.remove('abierto', 'cerrando');

      document.documentElement.classList.remove('leyendo');
      window.scrollTo(0, 0);
      vibrar(14);

      pararMusica();
      rebobinarCancion();

      // los días vuelven a cero, para que se cuenten otra vez al reabrir
      numerosHechos = false;
      hitos.forEach((h, i) => {
        const el = document.getElementById('num-' + i);
        if (el) el.textContent = '0';
      });
      yaBajo = false;
    }, 4050);
  }

  sobre.addEventListener('click', abrir);
  sobre.addEventListener('keydown', e => {
    if (e.key === 'Enter' || e.key === ' '){ e.preventDefault(); abrir(); }
  });

  /* ============================================================
     5. LOS NÚMEROS
     ============================================================ */
  let numerosHechos = false;

  function animarNumeros(){
    if (numerosHechos) return;
    numerosHechos = true;

    hitos.forEach((h, i) => {
      const el = document.getElementById('num-' + i);
      if (!el) return;

      const fijar = () => { el.textContent = h.dias.toLocaleString('es-MX'); };
      if (menosMovimiento){ fijar(); return; }

      const dur = 1700, espera = i * 320, t0 = performance.now() + espera;
      (function paso(ahora){
        if (ahora < t0){ requestAnimationFrame(paso); return; }
        const p = Math.min(1, (ahora - t0) / dur);
        const suave = 1 - Math.pow(1 - p, 4);
        el.textContent = Math.round(h.dias * suave).toLocaleString('es-MX');
        if (p < 1) requestAnimationFrame(paso);
      })(performance.now());

      setTimeout(fijar, espera + dur + 150);
    });
  }

  let soltarNumeros = null;   // para poder dejar de vigilar si se cierra la carta

  function vigilarNumeros(){
    if (soltarNumeros) soltarNumeros();
    const zona = $('#hitos');

    function revisar(){
      const r = zona.getBoundingClientRect();
      if (r.top < vh() * 0.85 && r.bottom > 0){
        animarNumeros();
        soltar();
      }
    }

    function soltar(){
      window.removeEventListener('scroll', revisar);
      clearInterval(repaso);
      soltarNumeros = null;
    }

    window.addEventListener('scroll', revisar, { passive: true });
    const repaso = setInterval(revisar, 500);
    soltarNumeros = soltar;
    revisar();
  }

  let yaBajo = false;
  window.addEventListener('scroll', () => {
    if (!yaBajo && cuantoBajo() > 60){
      yaBajo = true;
      $('#baja').classList.remove('ver');
    }
  }, { passive: true });

  /* ============================================================
     6. BOTONES
     ============================================================ */
  /* --- bajar solo, sin depender del scroll suave del navegador --- */
  function bajarHasta(elemento, margen){
    if (!elemento) return;
    const destino = cuantoBajo() + elemento.getBoundingClientRect().bottom
                    - vh() + (margen || 24);
    const tope = Math.max(0, Math.min(destino, document.documentElement.scrollHeight - vh()));
    const desde = cuantoBajo();
    const salto = tope - desde;
    if (Math.abs(salto) < 4) return;

    if (menosMovimiento){ window.scrollTo(0, tope); return; }

    const dur = 420, t0 = performance.now();
    (function paso(ahora){
      const p = Math.min(1, (ahora - t0) / dur);
      const suave = 1 - Math.pow(1 - p, 3);
      window.scrollTo(0, desde + salto * suave);
      if (p < 1) requestAnimationFrame(paso);
    })(performance.now());

    // si el navegador congelara las animaciones, al menos llega
    setTimeout(() => { if (Math.abs(cuantoBajo() - tope) > 40) window.scrollTo(0, tope); }, dur + 200);
  }

  $('#btn-perdon').addEventListener('click', () => {
    const resp = $('#respuesta');
    resp.classList.add('ver');
    vibrar([12, 50, 12, 50, 20]);
    fuegosArtificiales();
    lluviaDeCorazones();

    // la carta baja sola, y rápido, para que se lea el mensaje mientras aparece
    agendar(() => bajarHasta(resp, 30), 180);
    agendar(() => bajarHasta(resp, 30), 900);
    agendar(() => bajarHasta($('.acciones'), 30), 1900);
  });

  $('#btn-cerrar').addEventListener('click', cerrar);

  /* --- fuegos artificiales --- */
  const lienzoFuegos = $('#fuegos');
  const ctxF = lienzoFuegos.getContext('2d');
  let chispas = [], quemando = false, cortarFuegos = null;

  function medirFuegos(){
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    lienzoFuegos.width  = Math.floor(vw() * dpr);
    lienzoFuegos.height = Math.floor(vh() * dpr);
    lienzoFuegos.style.width  = vw() + 'px';
    lienzoFuegos.style.height = vh() + 'px';
    ctxF.setTransform(dpr, 0, 0, dpr, 0, 0);
  }

  function estallido(x, y, color){
    const cuantas = 34 + Math.floor(Math.random() * 18);
    for (let i = 0; i < cuantas; i++){
      const ang = (Math.PI * 2 * i) / cuantas + Math.random() * 0.25;
      const fuerza = 2.1 + Math.random() * 3.6;
      chispas.push({
        x: x, y: y,
        vx: Math.cos(ang) * fuerza,
        vy: Math.sin(ang) * fuerza,
        vida: 1,
        baja: 0.011 + Math.random() * 0.013,
        r: 1.5 + Math.random() * 2.3,
        color: color
      });
    }
  }

  function pintarFuegos(){
    if (!quemando) return;
    ctxF.clearRect(0, 0, vw(), vh());

    for (let i = chispas.length - 1; i >= 0; i--){
      const c = chispas[i];
      c.x += c.vx;
      c.y += c.vy;
      c.vy += 0.055;              // la gravedad las va bajando
      c.vx *= 0.985;
      c.vy *= 0.985;
      c.vida -= c.baja;

      if (c.vida <= 0){ chispas.splice(i, 1); continue; }

      ctxF.globalAlpha = Math.max(0, c.vida);
      ctxF.fillStyle = c.color;
      ctxF.beginPath();
      ctxF.arc(c.x, c.y, c.r * c.vida, 0, 6.2832);
      ctxF.fill();
    }
    ctxF.globalAlpha = 1;

    if (chispas.length) requestAnimationFrame(pintarFuegos);
    else apagarFuegos();
  }

  function apagarFuegos(){
    quemando = false;
    chispas = [];
    try { ctxF.clearRect(0, 0, vw(), vh()); } catch(e){}
    lienzoFuegos.classList.remove('ver');
    if (cortarFuegos){ clearTimeout(cortarFuegos); cortarFuegos = null; }
  }

  function fuegosArtificiales(){
    if (menosMovimiento) return;

    medirFuegos();
    lienzoFuegos.classList.add('ver');

    if (!quemando){
      quemando = true;
      requestAnimationFrame(pintarFuegos);
    }

    const colores = ['#ff6a3d', '#c4451c', '#ffb347', '#ffffff', '#ff3d1f', '#e0722f', '#ffe08a'];

    // once explosiones, una detrás de otra, por toda la pantalla
    for (let k = 0; k < 11; k++){
      agendar(() => {
        if (!quemando) return;
        estallido(
          vw() * (0.1 + Math.random() * 0.8),
          vh() * (0.12 + Math.random() * 0.52),
          colores[Math.floor(Math.random() * colores.length)]
        );
        vibrar(8);
      }, k * 300);
    }

    // por si el navegador congelara las animaciones, se limpia solo
    if (cortarFuegos) clearTimeout(cortarFuegos);
    cortarFuegos = setTimeout(apagarFuegos, 14000);
  }

  window.addEventListener('resize', () => { if (quemando) medirFuegos(); });

  function lluviaDeCorazones(){
    if (menosMovimiento) return;
    const simbolos = ['♥','♡','✿','❥','✦'];
    const colores = ['rgba(255,106,61,.95)','rgba(196,69,28,.9)',
                     'rgba(255,255,255,.85)','rgba(255,179,71,.95)'];
    for (let i = 0; i < 26; i++){
      setTimeout(() => {
        const c = document.createElement('div');
        c.className = 'corazon';
        c.textContent = simbolos[Math.floor(Math.random() * simbolos.length)];
        c.style.left = (Math.random() * 92 + 4) + 'vw';
        c.style.fontSize = (12 + Math.random() * 16) + 'px';
        c.style.color = colores[Math.floor(Math.random() * colores.length)];
        c.style.animationDuration = (4.2 + Math.random() * 2.6) + 's';
        document.body.appendChild(c);
        setTimeout(() => c.remove(), 7200);
      }, i * 120);
    }
  }

  function vibrar(patron){
    if (navigator.vibrate){ try { navigator.vibrate(patron); } catch(e){} }
  }

  /* ============================================================
     7. MÚSICA · la canción, en bucle
     Arranca en cuanto ella toca el sobre (iOS exige ese toque para
     dejar sonar audio) y se repite sola, sin parar.
     ============================================================ */
  const audio = $('#cancion');
  let sonando = false;

  function marcar(activo){
    sonando = activo;
    $('#btn-musica').classList.toggle('on', activo);
  }

  if (CARTA.cancion){
    // igual que con los stickers: da igual dónde esté guardado el MP3
    const nombreMp3 = CARTA.cancion.split('/').pop();
    const rutasMp3 = [CARTA.cancion];
    if (CARTA.cancion.indexOf('/') > -1) rutasMp3.push(nombreMp3);
    else rutasMp3.push('img/' + nombreMp3);

    let intentoMp3 = 0;
    audio.addEventListener('error', () => {
      intentoMp3++;
      if (intentoMp3 < rutasMp3.length){
        audio.src = encodeURI(rutasMp3[intentoMp3]);
        audio.load();
        if (sonando) audio.play().catch(() => {});
      }
    });

    audio.src = encodeURI(rutasMp3[0]);
    audio.loop = true;
  } else {
    $('#controles').style.display = 'none';   // sin canción, el botón sobra
  }

  function arrancarMusica(){
    if (!CARTA.cancion) return;

    // entra bajito y va subiendo. En iPhone el volumen no se puede
    // cambiar por código: allí simplemente entra a su volumen normal.
    try { audio.volume = 0.15; } catch(e){}

    const intento = audio.play();
    if (intento && intento.then){
      intento.then(() => { marcar(true); subirVolumen(); })
             .catch(() => marcar(false));   // si el navegador lo bloquea, queda el botón ♪
    } else {
      marcar(true);
      subirVolumen();
    }
  }

  function subirVolumen(){
    let v = 0.15;
    const paso = setInterval(() => {
      v += 0.09;
      try { audio.volume = Math.min(1, v); } catch(e){}
      if (v >= 1) clearInterval(paso);
    }, 130);
    // pase lo que pase, en 2 segundos está a volumen completo
    setTimeout(() => { clearInterval(paso); try { audio.volume = 1; } catch(e){} }, 2000);
  }

  function pararMusica(){
    try { audio.pause(); } catch(e){}
    marcar(false);
  }

  // el reverso de subirVolumen: se usa al cerrar la carta, para que la
  // música se vaya apagando en vez de cortarse de golpe. En iPhone el
  // volumen no se puede cambiar por código (igual que en subirVolumen),
  // así que ahí simplemente sigue sonando hasta que pararMusica() la corta.
  function bajarVolumen(ms){
    const v0 = audio.volume;
    const pasos = Math.max(1, Math.round(ms / 80));
    let i = 0;
    const paso = setInterval(() => {
      i++;
      try { audio.volume = Math.max(0, v0 * (1 - i / pasos)); } catch(e){}
      if (i >= pasos) clearInterval(paso);
    }, ms / pasos);
    setTimeout(() => {
      clearInterval(paso);
      pararMusica();
      try { audio.volume = 1; } catch(e){}   // lista para la próxima vez que abra
    }, ms + 40);
  }

  // deja la canción lista para volver a empezar desde el principio
  function rebobinarCancion(){
    try { audio.currentTime = 0; } catch(e){}
  }

  // por si el bucle fallara en algún navegador
  audio.addEventListener('ended', () => {
    if (!sonando) return;
    audio.currentTime = 0;
    audio.play().catch(() => {});
  });

  audio.addEventListener('pause', () => marcar(false));
  audio.addEventListener('play',  () => marcar(true));

  $('#btn-musica').addEventListener('click', function(){
    sonando ? pararMusica() : arrancarMusica();
  });

  // al volver a la carta desde otra app, la canción sigue donde iba
  document.addEventListener('visibilitychange', () => {
    if (!document.hidden && sonando && audio.paused){
      audio.play().catch(() => {});
    }
  });

  // evitar el zoom por doble toque en iOS
  let ultimoToque = 0;
  document.addEventListener('touchend', e => {
    const ahora = Date.now();
    if (ahora - ultimoToque < 320) e.preventDefault();
    ultimoToque = ahora;
  }, { passive: false });

})();
</script>
</body>
</html>
